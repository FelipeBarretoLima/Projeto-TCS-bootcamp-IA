[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "statement"
version = "0.1.0"
description = "Extração, anonimização e normalização de extratos bancários"
requires-python = ">=3.12,<3.13"

# módulo de extração: código em extraction/src/statement (instalado em modo editável pelo requirements.txt)
[tool.setuptools.packages.find]
where = ["extraction/src"]

[tool.setuptools.package-data]
statement = ["dados/*.txt"]

# testes dos módulos; "." deixa os pacotes ml, api, database e agent importáveis
[tool.pytest.ini_options]
testpaths = ["extraction/tests", "ml/tests", "api/tests", "database/tests", "agent/tests"]
pythonpath = ["extraction/src", "."]
