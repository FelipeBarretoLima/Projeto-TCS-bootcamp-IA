<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAS – Transactions Assistancy Service</title>
    <script>
      // aplica o tema antes da primeira pintura (evita piscar no tema errado).
      // Padrão: claro; escuro só se o usuário escolheu no botão (mesma chave de src/hooks/useTema.ts)
      document.documentElement.dataset.tema = 'claro'
      try {
        if (localStorage.getItem('tas-tema-escolhido') === 'escuro') document.documentElement.dataset.tema = 'escuro'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
